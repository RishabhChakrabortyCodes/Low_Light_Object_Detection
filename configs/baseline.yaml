# configs/baseline.yaml
run_name: baseline_v8n_exdark
seed: 0

model:
  name: yolov8n          # key into your model registry
  weights: yolov8n.pt    # pretrained start, or null for scratch
  # for custom models later: yaml: configs/models/ours.yaml

data:
  dataset: exdark_v1
  data_yaml: data/exdark.yaml   # train/val/test paths + class names
  imgsz: 640

preprocessing:
  enhancer: none         # none | zero_dce | ...

train:
  epochs: 100
  batch: 16
  optimizer: SGD         # SGD | AdamW | auto
  lr0: 0.01
  lrf: 0.01              # final LR fraction
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  patience: 30           # early stopping
  workers: 2
  amp: true              # mixed precision
  cache: false           # true if RAM allows
  resume: false

augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4             # brightness jitter: matters a lot for low-light
  fliplr: 0.5
  mosaic: 1.0
  scale: 0.5

eval:
  split: test            # val | test
  conf: 0.001            # low threshold for mAP
  iou: 0.6
  illumination_levels: [1.0, 0.5, 0.25, 0.1]   # for robustness sweeps (later)

benchmark:
  batch: 1
  warmup_iters: 50
  timed_iters: 200
  precision: fp16        # fp32 | fp16
  include_preprocessing: true

output:
  dir: outputs/${run_name}